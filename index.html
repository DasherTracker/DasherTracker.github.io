<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasher Dashboard</title>
    <meta name="description" content="Beautiful dashboard for Dasher Tracker data">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=2.0.1">
    <!-- PapaParse for CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- Chart.js for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="background-mesh"></div>
    
    <main class="dashboard-container">
        <header class="dashboard-header">
            <h1>Dasher Tracker</h1>
            <p>Your real-time delivery earnings & analytics</p>
            <button id="refreshBtn" class="refresh-btn" onclick="fetchDashboardData()">
                Refresh Data
            </button>
        </header>

        <section class="summary-cards" id="summaryCards">
            <!-- Cards will be populated by JS -->
            <div class="card skeleton"></div>
            <div class="card skeleton"></div>
            <div class="card skeleton"></div>
            <div class="card skeleton"></div>
            <div class="card skeleton"></div>
            <div class="card skeleton"></div>
        </section>

        <section class="chart-section glass-panel">
            <div class="chart-header-row">
                <h2>Analytics Visualizer</h2>
                <div class="chart-toggle-group">
                    <button class="chart-btn active" id="chartBtnLine" onclick="switchChart('line')">📈 Earnings Trend</button>
                    <button class="chart-btn" id="chartBtnBar" onclick="switchChart('bar')">📊 Pay vs. Gas</button>
                    <button class="chart-btn" id="chartBtnDonut" onclick="switchChart('donut')">🍩 Income Split</button>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="earningsChart"></canvas>
            </div>
        </section>

        <section class="table-section glass-panel">
            <h2>Monthly Summary</h2>
            <div class="table-responsive">
                <table id="dashTable">
                    <thead>
                        <tr>
                            <th>Month</th>
                            <th>Hours</th>
                            <th>Active Hours</th>
                            <th>Miles</th>
                            <th>Deliveries</th>
                            <th>Base Pay</th>
                            <th>Tips</th>
                            <th>Cash Tips</th>
                            <th>Taxes</th>
                            <th>Gas</th>
                            <th>Total</th>
                            <th>Hourly Rate</th>
                            <th># No Tip</th>
                            <th>% No Tip</th>
                        </tr>
                    </thead>
                    <tbody id="dashTableBody">
                        <!-- Rows populated by JS -->
                    </tbody>
                    <tfoot id="dashTableFoot">
                        <!-- Total Row populated by JS -->
                    </tfoot>
                </table>
            </div>
        </section>

        <section class="ratings-section glass-panel">
            <h2>Dasher Ratings & Review Breakdown</h2>
            <div class="ratings-grid" id="ratingsGrid">
                <!-- Populated by JS -->
            </div>
        </section>

        <section class="feedback-section glass-panel">
            <h2>Customer Feedback & Compliments</h2>
            <div class="feedback-grid" id="feedbackGrid">
                <!-- Populated by JS -->
            </div>
        </section>
    </main>

    <script src="script.js?v=2.4.1"></script>
</body>
</html>
